# 코드를 올리면 GitHub의 윈도우 서버가 편집 프로그램 런처(RADIO/TV)·프로그램 꾸러미·설치 파일을 만들어 Releases 에 올립니다.
# 회사 PC에는 파이썬·Inno Setup 이 필요 없습니다.
name: build-edit

on:
  push:
    branches: [main]
    paths: ["apps/**", "launcher/**", "installer/**", "tools/**", "tests/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: python -m pip install --upgrade pip pyinstaller pymupdf pillow openpyxl cryptography

      - name: 문법 검사 (두 프로그램 + 런처)
        run: python -m py_compile apps/runsheet/pdf_data_editor.py apps/schedule/ui.py apps/schedule/dmb.py launcher/launcher.py

      - name: 빠진 import 등 정의 안 된 이름 검사
        run: python tools/check_names.py apps/runsheet/pdf_data_editor.py apps/schedule/ui.py apps/schedule/dmb.py launcher/launcher.py

      - name: 편성표 블록 찾기 점검 (실제 편성표 PDF)
        run: python tests/test_schedule_detect.py

      - name: 화면 점검 (DMB 편집 화면)
        timeout-minutes: 4
        continue-on-error: true
        run: python tests/test_gui_smoke.py

      - name: 런처 + 공용 실행 환경 만들기 (PyInstaller)
        shell: pwsh
        run: |
          $icon = @()
          if (Test-Path launcher\icon.ico) { $icon = @("--icon", "launcher\icon.ico") }
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name EditLauncher @icon `
            --collect-all pymupdf --collect-submodules openpyxl --collect-submodules PIL `
            --hidden-import tkinter.colorchooser --hidden-import tkinter.simpledialog `
            launcher\launcher.py
          if (-not (Test-Path dist\EditLauncher\EditLauncher.exe)) { throw "런처 exe 가 만들어지지 않았습니다" }

      - name: 공용 실행 환경 점검 (만든 런처로 실제 부품을 불러 봄)
        shell: pwsh
        run: |
          $out = "$PWD\selftest.txt"
          $p = Start-Process dist\EditLauncher\EditLauncher.exe -ArgumentList "--selftest", "`"$out`"" -PassThru -Wait
          if (-not (Test-Path $out)) { throw "점검 결과 파일이 없습니다 (rc=$($p.ExitCode))" }
          $r = Get-Content $out -Raw -Encoding utf8
          Write-Host $r
          if ($r.Trim() -ne "OK") { throw "실행 환경에 빠진 부품이 있습니다" }

      - name: 꾸러미 만들기 (catalog.json, 프로그램 zip, 설치 zip)
        id: pkg
        shell: pwsh
        env:
          EDIT_SIGN_KEY: ${{ secrets.EDIT_SIGN_KEY }}
        run: |
          $tag = "r${{ github.run_number }}"
          $msg = (git log -1 --pretty=%s)
          python tools\build_packages.py $tag "$msg"
          if ($LASTEXITCODE -ne 0) { throw "꾸러미 실패" }
          python tools\verify_update.py Output\update
          if ($LASTEXITCODE -ne 0) { throw "서명 확인 실패" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Get-Content Output\versions.txt | ForEach-Object { $_ >> $env:GITHUB_OUTPUT }

      - name: 설치 파일 만들기 (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          Push-Location installer
          & $iscc "/DAppVer=${{ steps.pkg.outputs.launcher }}" "/DTag=${{ steps.pkg.outputs.tag }}" "/DSrcDir=..\dist\EditLauncher" "/DPkgDir=..\Output\update" setup.iss
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "Inno Setup 실패" }

      - name: Releases 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: 편집 프로그램 ${{ steps.pkg.outputs.tag }} (운행표 ${{ steps.pkg.outputs.runsheet }} · TV 편성표·DMB ${{ steps.pkg.outputs.schedule }} · 런처 ${{ steps.pkg.outputs.launcher }})
          body: |
            처음 설치(둘 중 하나, 파이썬 필요 없음)
            - EDIT_setup_${{ steps.pkg.outputs.tag }}.exe 실행
            - 또는 EDIT_install_${{ steps.pkg.outputs.tag }}.zip 압축 풀고 설치.bat
            업데이트
            - EDIT_update_${{ steps.pkg.outputs.tag }}.zip 의 내용을 업데이트 폴더(공유 폴더)에 풀어 두거나,
              각 PC 런처의 [업데이트 파일 가져오기] 로 이 zip 을 선택
            - 저장소가 공개(Public)이면 런처 업데이트 위치에 https://github.com/${{ github.repository }} 를 넣어 인터넷으로 바로 받기
              (catalog.json · app_*.zip · launcher_*.zip 은 그 용도)
          files: |
            Output/EDIT_setup_*.exe
            Output/EDIT_install_*.zip
            Output/EDIT_update_*.zip
            Output/update/catalog.json
            Output/update/catalog.sig
            Output/update/app_*.zip
            Output/update/launcher_*.zip
