# 녹음 PC 웹 (nginx) — install.sh 가 /etc/nginx/sites-available/edit 로 복사한다
#   /        첫 화면 (라디오 · TV · 녹음 바로가기)
#   /radio/  라디오 운행표 정산·검색·달력 (편집기 사본)
#   /tv/     TV 주간 편성표 (편집기 사본)
#   /rec/    녹음 파일 + 플레이어
#   /admin/  관리자 · 접속 기록 (비밀번호: bash ~/edit/server/admin-password.sh)

# 접속 기록: 한 줄씩 JSON (관리자 화면이 읽는다). nginx 기본 정리로 14일 보관
log_format edit_json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method",'
    '"u":"$request_uri","s":$status,"b":$body_bytes_sent,"rt":$request_time,'
    '"ua":"$http_user_agent","ref":"$http_referer"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    charset utf-8;
    access_log /var/log/nginx/edit-access.log edit_json;

    location = / { proxy_pass http://127.0.0.1:8081/; }
    location = /api/status { proxy_pass http://127.0.0.1:8081/api/status; }
    location = /api/tv { proxy_pass http://127.0.0.1:8081/api/tv; }      # 운행표 화면의 TV 탭 (public_host 쓸 때)
    # 녹음 구간 잘라 받기 (플레이어의 '✂ 구간 저장')
    location = /api/clip {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # 관리자 (비밀번호로 들어감)
    location = /admin { return 301 /admin/; }
    location /admin/ {
        proxy_pass http://127.0.0.1:8081/admin/;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8081/api/admin/;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # 상대 녹음 PC(본/예비 서버)의 관리자 화면이 읽는 백업 상태 (비밀 없음)
    location = /api/backup-status { proxy_pass http://127.0.0.1:8081/api/backup-status; }
    # 편집기 설정 백업은 녹음 PC 서버끼리만 쓰므로 웹으로는 열지 않음
    location = /radio/api/settings-backup { return 404; }

    location = /radio { return 301 /radio/; }
    location /radio/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_read_timeout 120s;
    }

    location = /tv { return 301 /tv/; }
    location /tv/ { proxy_pass http://127.0.0.1:8081/tv/; }

    location = /rec { return 301 /rec/; }
    # 플레이어는 브라우저가 예전 것을 기억하지 않게 (업데이트가 바로 보이도록)
    location = /rec/player.html {
        alias /home/rec/Recordings/player.html;
        add_header Cache-Control "no-cache";
    }
    # 녹음 기록·시스템 폴더는 웹에서 열지 않음
    location ~ "^/rec/(lost\+found|recording_logs|\.)" { return 404; }
    location /rec/ {
        alias /home/rec/Recordings/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        limit_rate_after 2m;
        limit_rate 5m;
    }

    # FM 녹음 PC 연결 등 이 PC만의 설정 (add-fm.sh 가 만든다)
    include /etc/nginx/edit-extra/*.conf;

    # 예전 주소 (http://녹음PC/player.html, http://녹음PC/2026-11-12/...) 는 /rec/ 로 넘긴다
    location = /player.html { return 301 /rec/player.html; }
    location ~ "^/(\d{4}-\d{2}-\d{2}/.*)$" { return 301 /rec/$1; }
}
