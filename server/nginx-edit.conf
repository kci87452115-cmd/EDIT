# 녹음 PC 웹 (nginx) — install.sh 가 /etc/nginx/sites-available/edit 로 복사한다
#   /        첫 화면 (라디오 · TV · 녹음 바로가기)
#   /radio/  라디오 운행표 정산·검색·달력 (편집기 사본)
#   /tv/     TV 주간 편성표 (편집기 사본)
#   /rec/    녹음 파일 + 플레이어
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    charset utf-8;

    location = / { proxy_pass http://127.0.0.1:8081/; }
    location = /api/status { proxy_pass http://127.0.0.1:8081/api/status; }

    location = /radio { return 301 /radio/; }
    location /radio/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_read_timeout 120s;
    }

    location = /tv { return 301 /tv/; }
    location /tv/ { proxy_pass http://127.0.0.1:8081/tv/; }

    location = /rec { return 301 /rec/; }
    location /rec/ {
        alias /home/rec/Recordings/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        limit_rate_after 2m;
        limit_rate 5m;
    }

    # 예전 주소 (http://녹음PC/player.html, http://녹음PC/2026-11-12/...) 는 /rec/ 로 넘긴다
    location = /player.html { return 301 /rec/player.html; }
    location ~ "^/(\d{4}-\d{2}-\d{2}/.*)$" { return 301 /rec/$1; }
}
