<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>녹음 플레이어</title>
<style>
  :root { --bg:#111; --panel:#1c1c1c; --line:#333; --fg:#eee; --dim:#888; --acc:#3fa9f5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
  .wrap { max-width:1400px; margin:0 auto; padding:16px; display:flex; gap:16px; height:100vh; }
  #list { width:320px; flex-shrink:0; background:var(--panel); border-radius:10px; overflow:auto; padding:8px; }
  #list .path { font-size:13px; color:var(--dim); padding:6px 8px; word-break:break-all; }
  #list a { display:block; padding:7px 10px; color:var(--fg); text-decoration:none; border-radius:6px; font-size:14px; }
  #list a:hover { background:#2a2a2a; }
  #list a.on { background:var(--acc); color:#000; }
  #list a.dir { color:#f5c26b; }
  main { flex:1; display:flex; flex-direction:column; gap:18px; min-width:0; }
  #title { font-size:18px; font-weight:bold; word-break:break-all; }
  .clock { display:flex; gap:28px; align-items:baseline; flex-wrap:wrap; }
  .clock .big { font-size:42px; font-variant-numeric:tabular-nums; }
  .clock .lbl { font-size:12px; color:var(--dim); display:block; }
  /* 진행바 */
  #bar { position:relative; height:64px; background:var(--panel); border-radius:8px; cursor:pointer; user-select:none; }
  #fill { position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(63,169,245,.35); border-radius:8px 0 0 8px; }
  #head { position:absolute; top:0; bottom:0; width:3px; background:var(--acc); left:0; }
  .tick { position:absolute; bottom:0; width:1px; height:14px; background:#666; }
  .tick.major { height:28px; background:#aaa; }
  .tick span { position:absolute; bottom:30px; left:4px; font-size:12px; color:var(--dim); white-space:nowrap; }
  #tip { position:absolute; top:-30px; padding:3px 7px; background:#000; border:1px solid var(--line); border-radius:4px; font-size:12px; display:none; transform:translateX(-50%); white-space:nowrap; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { background:#2a2a2a; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:10px 16px; font-size:15px; cursor:pointer; }
  button:hover { background:#383838; }
  button.play { background:var(--acc); color:#000; font-weight:bold; min-width:90px; }
  button.sp.on { border-color:var(--acc); color:var(--acc); }
  .vol { margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--dim); font-size:13px; }
  .dlbtn { background:#2a2a2a; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:10px 16px; font-size:15px; text-decoration:none; }
  .dlbtn:hover { background:#383838; }
  #list .row { display:flex; align-items:center; }
  #list .row a.f { flex:1; min-width:0; }
  #list .row a.d { flex:0 0 auto; padding:7px 9px; color:var(--dim); }
  #list .row a.d:hover { color:var(--acc); }
  .help { font-size:12px; color:var(--dim); }
  #msg { color:#f77; font-size:13px; }
  /* 구간 저장 */
  #region { position:absolute; top:0; bottom:0; background:rgba(245,194,107,.22); border-left:2px solid #f5c26b; border-right:2px solid #f5c26b; pointer-events:none; display:none; }
  #clip { background:var(--panel); border:1px solid #4a3d22; border-radius:10px; padding:14px 16px; display:none; flex-direction:column; gap:12px; }
  #clip .crow { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #clip .ttl { font-weight:bold; color:#f5c26b; }
  #clip input.tm { width:110px; background:#111; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:9px 10px; font-size:16px; font-variant-numeric:tabular-nums; text-align:center; }
  #clip input.tm:focus { outline:none; border-color:#f5c26b; }
  #clip button { padding:8px 12px; font-size:14px; }
  #clip .lbl2 { color:var(--dim); font-size:13px; }
  #clip label { display:inline-flex; align-items:center; gap:5px; padding:7px 11px; border:1px solid var(--line); border-radius:6px; cursor:pointer; font-size:14px; }
  #clip label:has(input:checked) { border-color:#f5c26b; color:#f5c26b; }
  #clip label input { accent-color:#f5c26b; margin:0; }
  #cSave { background:#f5c26b; color:#000; font-weight:bold; }
  #cSave:disabled { opacity:.6; cursor:wait; }
  #cmsg { font-size:13px; }
  #cmsg.err { color:#f77; } #cmsg.ok { color:#7c7; }
  button.clipon { border-color:#f5c26b; color:#f5c26b; }
  /* 휴대폰: 목록을 위로, 플레이어를 아래로 */
  @media (max-width:760px){
    .wrap { flex-direction:column; height:auto; padding:10px; }
    #list { width:auto; max-height:38vh; }
    .clock .big { font-size:30px; }
    .vol { margin-left:0; }
    #clip input.tm { width:96px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav id="list"></nav>
  <main>
    <div id="title">왼쪽에서 파일을 고르세요</div>
    <div class="clock">
      <div><span class="lbl">재생 위치</span><span class="big" id="pos">0:00:00</span><span id="dur" style="color:var(--dim)"> / 0:00:00</span></div>
      <div id="bcWrap" style="display:none"><span class="lbl">방송 시각</span><span class="big" id="bc">--:--:--</span></div>
    </div>
    <div id="bar"><div id="region"></div><div id="fill"></div><div id="head"></div><div id="tip"></div></div>
    <div class="btns">
      <button data-j="-60">⏪ 1분</button>
      <button data-j="-10">◀ 10초</button>
      <button class="play" id="play">▶ 재생</button>
      <button data-j="10">10초 ▶</button>
      <button data-j="60">1분 ⏩</button>
      <span style="width:12px"></span>
      <button class="sp on" data-s="1">1x</button>
      <button class="sp" data-s="1.5">1.5x</button>
      <button class="sp" data-s="2">2x</button>
      <a id="dl" class="dlbtn" style="display:none" download>⬇ 다운로드</a>
      <button id="clipBtn" style="display:none" title="필요한 부분만 잘라 MP3로 내려받기">✂ 구간 저장</button>
      <div class="vol" title="100%보다 크게 하면 소리를 키웁니다 (최대 300%, 찢어지지 않게 자동 제한)">🔊 <input type="range" id="vol" min="0" max="3" step="0.05" value="1"><span id="volv" style="min-width:42px;text-align:right">100%</span></div>
    </div>
    <div id="clip">
      <div class="crow"><span class="ttl">✂ 구간 저장</span>
        <span class="lbl2">원본 녹음은 그대로 두고, 고른 부분만 새 MP3 파일로 내려받습니다 · 한 번에 최대 <b id="cmax">30</b>분</span></div>
      <div class="crow">
        <span class="lbl2" id="cmode">시작</span>
        <input class="tm" id="cs" placeholder="00:00:00"><button id="csNow" title="단축키 [">지금 위치로</button>
        <span style="width:10px"></span>
        <span class="lbl2">끝</span>
        <input class="tm" id="ce" placeholder="00:00:00"><button id="ceNow" title="단축키 ]">지금 위치로</button>
        <span style="width:10px"></span>
        <span class="lbl2">길이</span> <b id="clen">-</b>
      </div>
      <div class="crow"><span class="lbl2">소리 크기</span>
        <label><input type="radio" name="cvol" value="0" checked>그대로</label>
        <label><input type="radio" name="cvol" value="6">조금 크게</label>
        <label><input type="radio" name="cvol" value="12">크게</label>
        <label title="작은 소리·큰 소리를 방송 기준 크기로 고르게 맞춥니다"><input type="radio" name="cvol" value="auto">자동 맞춤</label>
      </div>
      <div class="crow">
        <button id="cPrev">▶ 구간 미리 듣기</button>
        <button id="cSave">⬇ MP3로 저장</button>
        <span id="cmsg"></span>
      </div>
    </div>
    <div class="help">단축키: Space 재생/정지 · ←/→ 10초 · Shift+←/→ 1분 · 진행바 클릭·드래그로 이동 · 구간 저장: [ 시작 · ] 끝</div>
    <div id="msg"></div>
  </main>
</div>
<audio id="au" preload="metadata"></audio>
<script>
const au = document.getElementById('au');
const bar = document.getElementById('bar'), fill = document.getElementById('fill'),
      head = document.getElementById('head'), tip = document.getElementById('tip');
const $ = id => document.getElementById(id);
const AUDIO = /\.(mp3|m4a|aac|wav|ogg|opus|flac)$/i;
const HIDE = /^(lost\+found|recording_logs|\.)/i;   // 목록에 보이지 않을 폴더
let startClock = null;   // 파일 이름에서 읽은 녹음 시작 시각(초)

function fmt(s){ s=Math.max(0,Math.floor(s||0)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function fmtClock(s){ s=Math.floor(s)%86400; const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return [h,m,x].map(v=>String(v).padStart(2,'0')).join(':'); }

// 파일 이름에서 날짜/시각 추정: 20261112_1900, 2026-11-12_19-00, 20261112-19 등
function parseStart(name){
  const m = name.match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})[ _T.-]*(\d{2})(?:[-_:.h]?(\d{2}))?(?:[-_:.m]?(\d{2}))?/);
  if(!m) return null;
  const h=+m[4], mi=+(m[5]||0), se=+(m[6]||0);
  if(h>23||mi>59||se>59) return null;
  return h*3600+mi*60+se;
}

// ---- 폴더 목록 (웹서버 폴더 목록 페이지를 읽어서 표시) ----
// 폴더 이동은 페이지 안에서만 처리 (주소창은 player.html 그대로)
let dir = './';
function go(d){ dir = d || './'; loadList(); }
function navLink(a, d){ a.href='#'; a.onclick=e=>{ e.preventDefault(); go(d); }; }
async function loadList(){
  const list = $('list');
  list.innerHTML = '<div class="path">불러오는 중…</div>';
  try{
    const r = await fetch(dir); const html = await r.text();
    const doc = new DOMParser().parseFromString(html,'text/html');
    const base = new URL(dir, location.href);
    const seen = new Set(), dirs=[], files=[];
    doc.querySelectorAll('a[href]').forEach(a=>{
      const href=a.getAttribute('href');
      if(!href || href.startsWith('?') || href.startsWith('#') || href.startsWith('../') || href==='/' ) return;
      const u = new URL(href, base);
      if(!u.href.startsWith(base.href) || u.href===base.href || seen.has(u.href)) return;
      seen.add(u.href);
      const name = decodeURIComponent(u.pathname.slice(base.pathname.length));
      if(HIDE.test(name)) return;                                            // 녹음 기록·시스템 폴더는 숨김
      if(name.endsWith('/') && !name.slice(0,-1).includes('/')) dirs.push({name,u});
      else if(AUDIO.test(name) && !name.includes('/')) files.push({name,u});
    });
    dirs.sort((a,b)=>b.name.localeCompare(a.name)); files.sort((a,b)=>b.name.localeCompare(a.name));
    list.innerHTML = '<div class="path">📁 '+decodeURIComponent(base.pathname)+'</div>';
    if(dir!=='./'){ const up=document.createElement('a'); up.className='dir'; up.textContent='⬆ 상위 폴더';
      navLink(up, dir.replace(/[^/]+\/$/,'')); list.appendChild(up); }
    dirs.forEach(d=>{ const a=document.createElement('a'); a.className='dir'; a.textContent='📁 '+d.name;
      navLink(a, (dir==='./'?'':dir)+d.name); list.appendChild(a); });
    files.forEach(f=>{ const row=document.createElement('div'); row.className='row';
      const a=document.createElement('a'); a.className='f'; a.textContent='🎵 '+f.name; a.href='#';
      a.onclick=e=>{ e.preventDefault(); list.querySelectorAll('a.on').forEach(x=>x.classList.remove('on')); a.classList.add('on'); openFile(f); };
      const d=document.createElement('a'); d.className='d'; d.textContent='⬇'; d.title='다운로드';
      d.href=f.u.href; d.setAttribute('download', f.name);
      row.appendChild(a); row.appendChild(d); list.appendChild(row); });
    if(!dirs.length && !files.length) list.innerHTML+='<div class="path">녹음 파일이 없습니다</div>';
  }catch(e){ list.innerHTML='<div class="path">폴더 목록을 읽지 못했습니다: '+e+'</div>'; }
}

function openFile(f){
  au.src = f.u.href; $('title').textContent = f.name; $('msg').textContent='';
  const dl=$('dl'); dl.href=f.u.href; dl.setAttribute('download', f.name); dl.style.display='';
  startClock = parseStart(f.name);
  $('bcWrap').style.display = startClock==null ? 'none' : '';
  $('clipBtn').style.display=''; clipS=null; clipE=null; clipShow();
  au.play().catch(()=>{});
}

// ---- 눈금 ----
function drawTicks(){
  bar.querySelectorAll('.tick').forEach(t=>t.remove());
  const d = au.duration; if(!isFinite(d)||d<=0) return;
  const minor = d>1800 ? 60 : (d>300 ? 30 : 10);          // 작은 눈금
  const major = d>1800 ? 600 : (d>300 ? 60 : 30);         // 큰 눈금(라벨)
  for(let t=0; t<=d; t+=minor){
    const el=document.createElement('div'); el.className='tick'+(t%major===0?' major':'');
    el.style.left=(t/d*100)+'%';
    if(t%major===0){ const s=document.createElement('span');
      s.textContent = startClock!=null ? fmtClock(startClock+t).slice(0,5) : (d>=3600? fmt(t).slice(0,-3) : fmt(t).slice(2));
      el.appendChild(s); }
    bar.appendChild(el);
  }
}

function update(){
  const d=au.duration, t=au.currentTime, p = d? t/d*100 : 0;
  fill.style.width=p+'%'; head.style.left=p+'%';
  $('pos').textContent=fmt(t); $('dur').textContent=' / '+fmt(d);
  if(startClock!=null) $('bc').textContent=fmtClock(startClock+t);
  $('play').textContent = au.paused ? '▶ 재생' : '⏸ 정지';
}
au.addEventListener('timeupdate',update);
au.addEventListener('play',update); au.addEventListener('pause',update);
au.addEventListener('loadedmetadata',()=>{ drawTicks(); update(); });
au.addEventListener('error',()=>{ $('msg').textContent='파일을 재생할 수 없습니다.'; });

// ---- 진행바 클릭/드래그 ----
function posFrom(e){ const r=bar.getBoundingClientRect(); return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); }
let drag=false;
bar.addEventListener('mousedown',e=>{ drag=true; seekTo(posFrom(e)); });
window.addEventListener('mouseup',()=>drag=false);
bar.addEventListener('mousemove',e=>{
  const p=posFrom(e), d=au.duration; if(!d) return;
  tip.style.display='block'; tip.style.left=(p*100)+'%';
  tip.textContent = fmt(p*d) + (startClock!=null ? '  ('+fmtClock(startClock+p*d)+')' : '');
  if(drag) seekTo(p);
});
bar.addEventListener('mouseleave',()=>tip.style.display='none');
function seekTo(p){ if(au.duration) { au.currentTime=p*au.duration; update(); } }

// ---- 버튼 ----
$('play').onclick=()=> au.src && (au.paused? au.play() : au.pause());
document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{ au.currentTime=Math.max(0,au.currentTime+(+b.dataset.j)); update(); });
document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{ au.playbackRate=+b.dataset.s;
  document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('on',x===b)); });
// ---- 소리 크기: 100%까지는 보통, 그 위로는 Web Audio로 키우고(최대 300%) 찢어지지 않게 제한
let actx=null, gain=null;
function ensureAudio(){
  if(actx) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const src=actx.createMediaElementSource(au);
    gain=actx.createGain();
    const lim=actx.createDynamicsCompressor();          // 리미터: 큰 소리만 눌러 줌
    lim.threshold.value=-2; lim.knee.value=4; lim.ratio.value=20; lim.attack.value=0.002; lim.release.value=0.2;
    src.connect(gain); gain.connect(lim); lim.connect(actx.destination);
  }catch(e){ actx=null; gain=null; }
  applyVol();
}
function applyVol(){
  const v=+$('vol').value;
  if(gain){ au.volume=1; gain.gain.value=v; } else { au.volume=Math.min(1,v); }
  $('volv').textContent=Math.round(v*100)+'%';
  $('volv').style.color=v>1?'#f59e0b':'';
  try{ localStorage.setItem('player_vol',String(v)); }catch(e){}
}
$('vol').oninput=()=>{ if(+$('vol').value>1) ensureAudio(); applyVol(); };
au.addEventListener('play',()=>{ if(+$('vol').value>1) ensureAudio(); if(actx&&actx.state==='suspended') actx.resume(); });
try{ const sv=parseFloat(localStorage.getItem('player_vol')); if(sv>=0&&sv<=3) $('vol').value=sv; }catch(e){}
applyVol();

// ---- 구간 저장: 고른 부분만 서버에서 잘라 새 MP3로 내려받음 (원본은 그대로) ----
let clipS=null, clipE=null, clipMax=30, previewing=false, clipOn=false;
fetch('/api/clip?info=1').then(r=>r.json()).then(j=>{ if(j.max_min){ clipMax=j.max_min; $('cmax').textContent=clipMax; } }).catch(()=>{});
function clipFmt(t){ return startClock!=null ? fmtClock(startClock+t) : fmt(t); }   // 방송 시각이 있으면 시각으로
function clipParse(v){
  const p=String(v).trim().replace(/[^\d:]/g,'').split(':').filter(x=>x!=='').map(Number);
  if(!p.length || p.some(isNaN)) return null;
  while(p.length<3) p.unshift(0);
  let t=p[0]*3600+p[1]*60+p[2];
  if(startClock!=null){ t-=startClock; if(t<0) t+=86400; }                         // 자정 넘긴 녹음
  const d=au.duration; if(isFinite(d)) t=Math.min(t,d);
  return Math.max(0,t);
}
function clipShow(){
  const d=au.duration, r=$('region');
  $('cmode').textContent = startClock!=null ? '시작 (방송 시각)' : '시작 (재생 위치)';
  if(clipS!=null && document.activeElement!==$('cs')) $('cs').value=clipFmt(clipS);
  if(clipE!=null && document.activeElement!==$('ce')) $('ce').value=clipFmt(clipE);
  if(clipS==null) $('cs').value=''; if(clipE==null) $('ce').value='';
  const ok = clipS!=null && clipE!=null && clipE>clipS;
  $('clen').textContent = ok ? fmt(clipE-clipS) : '-';
  $('clen').style.color = ok && clipE-clipS>clipMax*60 ? '#f77' : '';
  if(ok && isFinite(d) && d>0 && clipOn){
    r.style.display='block'; r.style.left=(clipS/d*100)+'%'; r.style.width=((clipE-clipS)/d*100)+'%';
  } else r.style.display='none';
}
function cmsg(t,c){ const m=$('cmsg'); m.textContent=t; m.className=c||''; }
function clipOpen(on){
  clipOn=on; $('clip').style.display = on ? 'flex' : 'none';
  $('clipBtn').classList.toggle('clipon', on);
  if(on && clipS==null && au.src){ clipS=au.currentTime; const d=au.duration;
    clipE = isFinite(d) ? Math.min(d, clipS+60) : clipS+60; }
  clipShow();
}
$('clipBtn').onclick=()=>clipOpen(!clipOn);
function setS(){ if(!au.src) return; clipOpen(true); clipS=au.currentTime; if(clipE!=null && clipE<=clipS) clipE=null; clipShow(); cmsg(''); }
function setE(){ if(!au.src) return; clipOpen(true); clipE=au.currentTime; if(clipS!=null && clipS>=clipE) clipS=null; clipShow(); cmsg(''); }
$('csNow').onclick=setS; $('ceNow').onclick=setE;
$('cs').onchange=()=>{ const t=clipParse($('cs').value); if(t!=null) clipS=t; clipShow(); };
$('ce').onchange=()=>{ const t=clipParse($('ce').value); if(t!=null) clipE=t; clipShow(); };
$('cs').onblur=$('ce').onblur=clipShow;
$('cPrev').onclick=()=>{
  if(clipS==null||clipE==null||clipE<=clipS){ cmsg('시작과 끝을 먼저 정해 주세요.','err'); return; }
  au.currentTime=clipS; previewing=true; au.play().catch(()=>{});
};
au.addEventListener('timeupdate',()=>{ if(previewing && clipE!=null && au.currentTime>=clipE){ au.pause(); previewing=false; } });
au.addEventListener('pause',()=>{ previewing=false; });
$('cSave').onclick=async()=>{
  if(!au.src) return;
  if(clipS==null||clipE==null||clipE<=clipS){ cmsg('시작과 끝을 먼저 정해 주세요. (끝이 시작보다 뒤)','err'); return; }
  if(clipE-clipS>clipMax*60){ cmsg('한 번에 '+clipMax+'분까지만 저장할 수 있습니다. 구간을 줄여 주세요.','err'); return; }
  const src=decodeURIComponent(new URL(au.src).pathname);
  const vol=document.querySelector('input[name=cvol]:checked').value;
  const q='/api/clip?src='+encodeURIComponent(src)+'&s='+clipS.toFixed(2)+'&e='+clipE.toFixed(2)+'&vol='+vol;
  const btn=$('cSave'); btn.disabled=true; const t0=Date.now();
  const tick=setInterval(()=>cmsg('만드는 중… '+Math.round((Date.now()-t0)/1000)+'초'),500); cmsg('만드는 중…');
  try{
    const r=await fetch(q);
    if(!r.ok){ let e='저장하지 못했습니다.'; try{ e=(await r.json()).error||e; }catch(_){}; throw new Error(e); }
    const blob=await r.blob();
    let name='구간.mp3'; const cd=r.headers.get('Content-Disposition')||'';
    const m=cd.match(/filename\*=UTF-8''([^;]+)/i); if(m) name=decodeURIComponent(m[1]);
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    clearInterval(tick); cmsg('저장했습니다: '+name+' ('+(blob.size/1048576).toFixed(1)+'MB)','ok');
  }catch(e){ clearInterval(tick); cmsg(String(e.message||e),'err'); }
  finally{ btn.disabled=false; }
};
au.addEventListener('loadedmetadata',clipShow);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT' && e.target.type!=='radio') return;
  if(e.key==='['){ e.preventDefault(); setS(); return; }
  if(e.key===']'){ e.preventDefault(); setE(); return; }
  if(e.code==='Space'){ e.preventDefault(); $('play').click(); }
  if(e.code==='ArrowLeft'){ au.currentTime-= e.shiftKey?60:10; update(); }
  if(e.code==='ArrowRight'){ au.currentTime+= e.shiftKey?60:10; update(); }
});
window.addEventListener('resize',drawTicks);
loadList();
</script>
